name: Build and Push Docker Images to AWS ECR

on:
  push:
    branches:
      - main  # Triggers when you push to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Log in to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push frontend image
      run: |
        docker build -t ${{ secrets.AWS_ECR_FRONTEND_URI }} ./frontend
        docker push ${{ secrets.AWS_ECR_FRONTEND_URI }}

    - name: Build and push backend image
      run: |
        docker build -t ${{ secrets.AWS_ECR_BACKEND_URI }} ./backend
        docker push ${{ secrets.AWS_ECR_BACKEND_URI }}
