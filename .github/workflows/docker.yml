name: Build and Push Docker Image to AWS ECR

on:
  push:
    branches:
      - main # Trigger this action on push to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v2

    # Step 2: Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    # Step 3: Cache Docker layers (for faster builds)
    - name: Cache Docker layers
      uses: actions/cache@v2
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    # Step 4: Set up AWS Credentials
    - name: Set up AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}  # Use GitHub Secret
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}  # Use GitHub Secret
        aws-region: ${{ secrets.AWS_REGION }}  # Use GitHub Secret

    # Step 5: Log in to Amazon ECR
    - name: Log in to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    # Step 6: Build the Docker image for frontend and backend
    - name: Build frontend Docker image
      run: |
        docker build -t your-repo-name/frontend ./frontend
        docker tag your-repo-name/frontend:latest <aws_account_id>.dkr.ecr.<region>.amazonaws.com/your-repo-name/frontend:latest
        docker push <aws_account_id>.dkr.ecr.<region>.amazonaws.com/your-repo-name/frontend:latest

    - name: Build backend Docker image
      run: |
        docker build -t your-repo-name/backend ./backend
        docker tag your-repo-name/backend:latest <aws_account_id>.dkr.ecr.<region>.amazonaws.com/your-repo-name/backend:latest
        docker push <aws_account_id>.dkr.ecr.<region>.amazonaws.com/your-repo-name/backend:latest

    # Step 7: Logout from Docker
    - name: Log out from Docker
      run: docker logout
